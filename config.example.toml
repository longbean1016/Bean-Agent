# BeanAgent 配置模板。复制为 config.toml 后填写本地配置。

[llm]
provider = "deepseek"
model = "deepseek-v4-flash" # 主对话模型
api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com/v1"
max_tokens = 8192 # 单次回复允许生成的最大 token 数
max_iterations = 40 # 单轮 ReAct 最大迭代次数，0 表示不限制
system_prompt = "You are BeanAgent, a helpful AI assistant with access to tools. Always respond in the same language the user uses."
request_timeout_s = 90.0 # 单次模型请求的超时秒数
multimodal = false # 主模型是否能直接接收图片；false 时可配置独立 VL 模型
enable_thinking = true # 开启 DeepSeek 推理模式，Provider 会转换为 thinking.type
# reasoning_effort = "high" # 可选推理强度；xhigh 会按 DeepSeek 协议转换为 max

# 可选：主模型不支持图片时取消注释，启用独立视觉模型
# [llm.vl]
# provider = "qwen"
# model = "qwen-vl-max"
# api_key = "${DASHSCOPE_API_KEY}"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# max_tokens = 2048
# request_timeout_s = 90.0

[memory]
enabled = true # 是否启用长期记忆
engine_name = "default" # 当前最小版本使用的记忆引擎
# 上下文 token 上限配置在 [llm].context_window；此处不再配置消息窗口。

[memory.embedding]
model = "text-embedding-v3"
api_key = "${DASHSCOPE_API_KEY}" # text-embedding-v3 使用 DashScope 密钥
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
dimensions = 1024 # BeanAgent 记忆表的固定向量维度

[memory.optimizer]
enabled = true # 是否启用记忆后台整理
interval_seconds = 64800 # 默认每 18 小时整理一次
merge_max_tokens = 16384 # 合并记忆时允许的最大 token 数
self_update_max_tokens = 2048 # 更新自我认知记忆时的最大 token 数
step_delay_seconds = 15 # 连续整理步骤之间的延迟秒数

[memory.retrieval]
hotness_alpha = 0.20 # 最终排序中的热度权重
half_life_days = 14.0 # 记忆热度的半衰期天数
rrf_k = 60 # RRF 融合的平滑常数
keyword_rrf_weight = 0.5 # 关键词检索的融合权重
max_forced_procedures = 3 # 带工具要求的强制流程单次注入上限

[memory.dedup]
event_candidate_threshold = 0.75 # Event 进入 LLM 语义判断的最低向量相似度
profile_candidate_threshold = 0.72 # Profile 进入 LLM 语义判断的最低向量相似度
preference_candidate_threshold = 0.65 # Preference 进入 LLM 语义判断的最低向量相似度
procedure_candidate_threshold = 0.82 # Procedure 进入 LLM 语义判断的最低向量相似度
candidate_top_k = 5 # 每条新记忆最多召回 5 条同类型旧记忆供 LLM 选择；Event 固定为 Top 3

[agent]
workdir = "." # 工具相对工作目录，实际根路径由 workspace 注入
max_concurrent_turns = 5 # 最多同时处理的不同会话数
max_queued_turns = 20 # 并发占满后允许等待的会话数

[channels.chat]
enabled = true # 是否启用网页聊天通道
host = "127.0.0.1" # 默认仅监听本机
port = 6322 # Web 服务监听端口
channel_name = "web" # session_key 使用的通道前缀
