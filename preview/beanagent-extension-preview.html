<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeanAgent · 扩展中心预览</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --surface: #ffffff;
      --surface-muted: #eaf0ee;
      --surface-hover: #f0f5f3;
      --surface-raised: #fbfcfb;
      --border: #dbe3df;
      --border-strong: #c5d1cc;
      --text: #17201e;
      --muted: #687570;
      --faint: #8d9994;
      --primary: #0b766e;
      --primary-hover: #095f59;
      --primary-wash: #d9eee8;
      --warning: #9a6d1f;
      --warning-wash: #fbf5e7;
      --danger: #af3d34;
      --danger-wash: #fff1ef;
      --shadow: 0 18px 50px rgba(26, 51, 43, .10);
      font-family: Aptos, "Microsoft YaHei UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 980px; height: 100vh; overflow: hidden; background: var(--bg); }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100vh; }
    .sidebar { display: flex; min-height: 0; flex-direction: column; padding: 18px 14px 12px; border-right: 1px solid var(--border); background: var(--surface-muted); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
    .brand-mark { display: grid; width: 32px; height: 32px; place-items: center; border-radius: 50%; background: linear-gradient(135deg, #0b8a7d, #095f59); color: #fff; font-weight: 700; box-shadow: 0 3px 10px rgba(11, 118, 110, .26); }
    .brand strong { font-size: 16px; letter-spacing: -.02em; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1.14fr; gap: 0; padding: 3px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
    .quick-actions button { display: flex; min-width: 0; height: 32px; align-items: center; justify-content: center; gap: 6px; padding: 0 7px; border: 0; border-radius: 5px; background: transparent; cursor: pointer; font-size: 12px; }
    .quick-actions button + button { border-left: 1px solid var(--border); border-radius: 0 5px 5px 0; }
    .quick-actions button:first-child { border-radius: 5px 0 0 5px; color: var(--text); font-weight: 650; }
    .quick-actions button:hover { background: var(--surface-hover); color: var(--primary-hover); }
    .side-nav { margin-top: 15px; }
    .side-nav button { display: flex; width: 100%; height: 36px; align-items: center; gap: 9px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: 13px; }
    .side-nav button:hover { background: var(--surface-hover); color: var(--text); }
    .side-nav button.active { background: var(--primary-wash); color: var(--primary-hover); font-weight: 650; }
    .side-subnav { display: grid; gap: 2px; margin: 3px 0 0 27px; padding-left: 10px; border-left: 1px solid #c3ddd5; }
    .side-subnav button { height: 30px; padding: 0 8px; color: var(--muted); font-size: 12px; }
    .side-subnav button.active { background: transparent; color: var(--primary-hover); font-weight: 650; }
    .badge { margin-left: auto; min-width: 22px; padding: 2px 6px; border-radius: 999px; background: #c5e6dd; color: var(--primary-hover); font-size: 10px; text-align: center; }
    .section-title { margin: 17px 8px 6px; color: var(--faint); font-size: 11px; font-weight: 650; }
    .session-list { flex: 1; overflow: hidden; }
    .workspace { margin: 0 3px 14px; }
    .workspace-head { display: flex; align-items: center; gap: 7px; min-height: 32px; color: var(--muted); }
    .workspace-head .folder { color: var(--primary); }
    .workspace-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .workspace-head small { display: block; overflow: hidden; margin-left: auto; color: var(--faint); font-size: 10px; }
    .session { display: flex; height: 35px; align-items: center; margin-left: 8px; padding: 0 9px; border-radius: 7px; color: var(--muted); font-size: 12px; }
    .session.active { background: var(--primary-wash); color: var(--text); }
    .settings { display: flex; height: 40px; align-items: center; gap: 9px; padding: 0 9px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
    .settings:hover { color: var(--text); background: var(--surface-hover); }
    .main { min-width: 0; background: var(--surface-raised); }
    .topbar { display: flex; height: 58px; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid var(--border); background: rgba(251, 252, 251, .96); }
    .topbar-title { display: flex; align-items: center; gap: 10px; }
    .topbar-title .icon { color: var(--primary); }
    .topbar-title strong { display: block; font-size: 15px; }
    .topbar-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .connection { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #36a486; box-shadow: 0 0 0 3px #dcf3eb; }
    .content { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 26px; max-width: 1120px; height: calc(100vh - 58px); margin: 0 auto; padding: 36px 42px; overflow: auto; }
    .tabs { display: flex; flex-direction: column; gap: 4px; }
    .tabs h1 { margin: 0 0 4px; font-size: 20px; }
    .tabs > p { margin: 0 0 17px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .tab { display: flex; height: 38px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: 13px; }
    .tab:hover { background: var(--surface-hover); color: var(--text); }
    .tab.active { background: var(--primary-wash); color: var(--primary-hover); font-weight: 650; }
    .main-panel { min-width: 0; }
    .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .panel-heading h2 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .panel-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .add-button { display: inline-flex; height: 34px; align-items: center; gap: 7px; padding: 0 12px; border: 1px solid var(--primary); border-radius: 6px; background: var(--primary); color: #fff; cursor: pointer; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .add-button:hover { background: var(--primary-hover); }
    .cards { display: grid; gap: 10px; }
    .card { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 11px; padding: 14px 15px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); box-shadow: 0 2px 5px rgba(35, 54, 48, .03); cursor: pointer; }
    .card:hover, .card.selected { border-color: #a6ccc2; box-shadow: 0 0 0 2px #e5f3ef; }
    .card.selected { background: #fcfffe; }
    .card-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 9px; background: #e6f3ef; color: var(--primary); font-size: 17px; }
    .card-copy strong { display: block; font-size: 13px; }
    .card-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .status { display: inline-flex; align-items: center; gap: 5px; color: #3e8f77; font-size: 11px; white-space: nowrap; }
    .status.warn { color: var(--warning); }
    .status.err { color: var(--danger); }
    .status .dot { width: 6px; height: 6px; box-shadow: none; }
    .status.warn .dot { background: #c99539; }
    .status.err .dot { background: var(--danger); }
    .detail { margin-top: 17px; padding: 17px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); }
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .detail-head h3 { margin: 0; font-size: 14px; }
    .detail-head span { color: var(--muted); font-size: 11px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 15px; }
    .field { display: grid; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 11px; }
    .field input { width: 100%; height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 5px; outline: none; background: #fbfdfc; color: var(--text); font-size: 12px; }
    .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px #e2f2ee; }
    .tools { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .tool { padding: 4px 7px; border: 1px solid #d7e6e1; border-radius: 999px; background: #f0f8f5; color: var(--primary-hover); font-size: 10px; }
    .detail-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--border); }
    .hint { max-width: 65%; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .danger-link { border: 0; background: transparent; color: var(--danger); cursor: pointer; font-size: 11px; }
    .empty-skill { padding: 26px; border: 1px dashed var(--border-strong); border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 12px; line-height: 1.7; }
    .toast { position: fixed; right: 28px; bottom: 24px; padding: 10px 14px; border: 1px solid #acd4c7; border-radius: 7px; background: #f2fbf7; color: var(--primary-hover); box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(19, 30, 26, .26); }
    .modal-backdrop.show { display: grid; }
    .modal { width: 430px; padding: 22px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); }
    .modal h3 { margin: 0; font-size: 17px; }
    .modal p { margin: 6px 0 17px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }
    .modal-actions button { height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); cursor: pointer; font-size: 12px; }
    .modal-actions .save { border-color: var(--primary); background: var(--primary); color: #fff; }
    @media (max-width: 1100px) { .content { padding: 28px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">B</span><strong>BeanAgent</strong></div>
      <div class="quick-actions">
        <button class="primary" data-toast="已准备新建对话">＋ <span>新对话</span></button>
        <button class="secondary" data-toast="打开工作目录选择">▣ <span>添加工作目录</span></button>
      </div>
      <nav class="side-nav">
        <button class="active" id="extensionNav">✦ <span>扩展</span><span class="badge">2</span></button>
        <div class="side-subnav"><button class="active" data-subtab="mcp">⚡ <span>MCP</span></button><button data-subtab="plugins">✦ <span>插件</span></button></div>
      </nav>
      <div class="session-list">
        <div class="section-title">置顶</div>
        <div class="session active">分析 BeanAgent 工具调度</div>
        <div class="section-title">项目</div>
        <div class="workspace"><div class="workspace-head"><span class="folder">□</span><strong>Agent_change</strong><small>3</small></div><div class="session">设计可观测性方案</div><div class="session">评估项目发布流程</div></div>
        <div class="section-title">最近</div>
        <div class="session">你好</div>
        <div class="session">今天的工作计划</div>
      </div>
      <button class="settings" data-toast="打开模型与连接设置">⚙ <span>设置</span></button>
    </aside>
    <main class="main">
      <header class="topbar"><div class="topbar-title"><span class="icon">✦</span><div><strong>扩展</strong><span>插件与 MCP 配置</span></div></div><div class="connection"><span class="dot"></span>服务已连接</div></header>
      <div class="content">
        <aside class="tabs"><h1>扩展</h1><p>配置 BeanAgent 的外部工具与能力。</p><button class="tab active" data-tab="mcp">⚡ MCP</button><button class="tab" data-tab="plugins">✦ 插件</button></aside>
        <section class="main-panel" id="panel"></section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modal"><div class="modal"><h3>添加 MCP 服务</h3><p>预览表单：实际接入时会由后端 Registry 启动本机进程并保存配置。</p><div class="detail-grid"><div class="field"><label>服务名称</label><input placeholder="例如 filesystem" /></div><div class="field"><label>工作目录（可选）</label><input placeholder="C:\\workspace" /></div><div class="field full"><label>启动命令</label><input placeholder="npx @modelcontextprotocol/server-filesystem" /></div><div class="field full"><label>环境变量</label><input placeholder="仅显示键名，值会被脱敏" /></div></div><div class="modal-actions"><button id="closeModal">取消</button><button class="save" id="saveModal">测试并保存</button></div></div></div>
  <script>
    const panel = document.getElementById('panel');
    const toast = document.getElementById('toast');
    const modal = document.getElementById('modal');
    let toastTimer;
    function showToast(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
    function renderMcp() {
      panel.innerHTML = `<div class="panel-heading"><div><h2>MCP</h2><p>连接外部工具服务，让 BeanAgent 获得更多能力。</p></div><button class="add-button" id="addMcp">＋ 添加 MCP</button></div><div class="cards"><div class="card selected" data-service="filesystem"><div class="card-icon">▤</div><div class="card-copy"><strong>filesystem</strong><small>本地文件与目录工具 · 4 个工具</small></div><span class="status"><i class="dot"></i>已连接</span></div><div class="card" data-service="github"><div class="card-icon">◉</div><div class="card-copy"><strong>github</strong><small>代码仓库与 Pull Request · 8 个工具</small></div><span class="status"><i class="dot"></i>已连接</span></div><div class="card" data-service="browser-search"><div class="card-icon">⌕</div><div class="card-copy"><strong>browser-search</strong><small>浏览器搜索服务 · 等待测试</small></div><span class="status warn"><i class="dot"></i>未连接</span></div></div><div class="detail"><div class="detail-head"><div><h3 id="detailName">filesystem</h3><span>本地 stdio MCP · 当前运行区</span></div><span class="status"><i class="dot"></i>已连接</span></div><div class="detail-grid"><div class="field full"><label>启动命令</label><input value="npx @modelcontextprotocol/server-filesystem ./" readonly /></div><div class="field"><label>工作目录</label><input value="D:\\code\\Agent_change" readonly /></div><div class="field"><label>环境变量</label><input value="已配置 2 项（已脱敏）" readonly /></div></div><div class="field full" style="margin-top:12px"><label>已注册工具</label><div class="tools"><span class="tool">read_file</span><span class="tool">write_file</span><span class="tool">list_directory</span><span class="tool">search_files</span></div></div><div class="detail-foot"><span class="hint">MCP 服务会启动本机子进程。启用前请确认命令来源可信。</span><button class="danger-link" data-toast="预览：此处将移除 MCP 服务">移除服务</button></div></div>`;
      document.getElementById('addMcp').onclick = () => modal.classList.add('show');
      panel.querySelectorAll('.card').forEach(card => card.onclick = () => { panel.querySelectorAll('.card').forEach(item => item.classList.remove('selected')); card.classList.add('selected'); document.getElementById('detailName').textContent = card.dataset.service; });
      panel.querySelectorAll('[data-toast]').forEach(btn => btn.onclick = () => showToast(btn.dataset.toast));
    }
    function renderSkills() { panel.innerHTML = `<div class="panel-heading"><div><h2>插件</h2><p>管理 BeanAgent 的工作流指令与能力说明。</p></div><button class="add-button" data-toast="预览：此处将打开插件导入">＋ 导入插件</button></div><div class="empty-skill"><strong>当前版本建议先展示已发现的插件 / Skills</strong><br />例如：日报写作、网页搜索、项目分析。插件属于提示词能力包，与会启动本机进程的 MCP 服务分开管理。</div>`; panel.querySelector('[data-toast]').onclick = () => showToast('预览：此处将打开插件导入'); }
    renderMcp();
    function selectSubtab(name) {
      document.querySelectorAll('.tab, .side-subnav button').forEach(item => item.classList.toggle('active', item.dataset.tab === name || item.dataset.subtab === name));
      name === 'mcp' ? renderMcp() : renderSkills();
    }
    document.querySelectorAll('.tab').forEach(tab => tab.onclick = () => selectSubtab(tab.dataset.tab));
    document.querySelectorAll('.side-subnav button').forEach(tab => tab.onclick = () => selectSubtab(tab.dataset.subtab));
    document.querySelectorAll('[data-toast]').forEach(btn => btn.onclick = () => showToast(btn.dataset.toast));
    document.getElementById('closeModal').onclick = () => modal.classList.remove('show');
    document.getElementById('saveModal').onclick = () => { modal.classList.remove('show'); showToast('预览：已提交测试并保存'); };
    modal.onclick = event => { if (event.target === modal) modal.classList.remove('show'); };
  </script>
</body>
</html>
