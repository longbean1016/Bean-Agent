<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeanAgent · 扩展中心预览</title>
  <style>
    :root { --bg:#f4f6f5;--surface:#fff;--surface-muted:#eaf0ee;--surface-hover:#f0f5f3;--surface-raised:#fbfcfb;--border:#dbe3df;--border-strong:#c5d1cc;--text:#17201e;--muted:#687570;--faint:#8d9994;--primary:#0b766e;--primary-hover:#095f59;--primary-wash:#d9eee8;--warning:#9a6d1f;--danger:#af3d34;--blue:#3f78a8;font-family:Aptos,"Microsoft YaHei UI",sans-serif;color:var(--text);background:var(--bg); }
    *{box-sizing:border-box}body{margin:0;min-width:1080px;height:100vh;overflow:hidden;background:var(--bg)}button,input{font:inherit}button{color:inherit}.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh}.sidebar{display:flex;min-height:0;flex-direction:column;padding:18px 14px 12px;border-right:1px solid var(--border);background:var(--surface-muted)}.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border-radius:50%;background:linear-gradient(135deg,#0b8a7d,#095f59);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(11,118,110,.26)}.brand strong{font-size:16px;letter-spacing:-.02em}.quick-actions{display:grid;grid-template-columns:1fr 1.14fr;gap:0;padding:3px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface)}.quick-actions button{display:flex;min-width:0;height:32px;align-items:center;justify-content:center;gap:6px;padding:0 7px;border:0;border-radius:5px;background:transparent;cursor:pointer;font-size:12px}.quick-actions button+button{border-left:1px solid var(--border);border-radius:0 5px 5px 0}.quick-actions button:first-child{border-radius:5px 0 0 5px;font-weight:650}.quick-actions button:hover,.side-nav button:hover{background:var(--surface-hover);color:var(--text)}.side-nav{margin-top:15px}.side-nav>button{display:flex;width:100%;height:36px;align-items:center;gap:9px;padding:0 9px;border:0;border-radius:7px;background:var(--primary-wash);color:var(--primary-hover);cursor:pointer;text-align:left;font-size:13px;font-weight:650}.side-subnav{display:grid;gap:2px;margin:3px 0 0 27px;padding-left:10px;border-left:1px solid #c3ddd5}.side-subnav button{display:flex;height:32px;align-items:center;gap:8px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-size:12px}.side-subnav button.active{background:var(--surface);color:var(--primary-hover);font-weight:650;box-shadow:0 1px 2px rgba(35,54,48,.05)}.badge{margin-left:auto;min-width:22px;padding:2px 6px;border-radius:999px;background:#c5e6dd;color:var(--primary-hover);font-size:10px;text-align:center}.side-subnav .count{margin-left:auto;color:var(--faint);font-size:10px}.section-title{margin:17px 8px 6px;color:var(--faint);font-size:11px;font-weight:650}.session-list{flex:1;overflow:hidden}.workspace{margin:0 3px 14px}.workspace-head{display:flex;align-items:center;gap:7px;min-height:32px;color:var(--muted)}.workspace-head .folder{color:var(--primary)}.workspace-head strong{font-size:12px}.workspace-head small{margin-left:auto;color:var(--faint);font-size:10px}.session{display:flex;height:35px;align-items:center;margin-left:8px;padding:0 9px;border-radius:7px;color:var(--muted);font-size:12px}.session.active{background:var(--primary-wash);color:var(--text)}.settings{display:flex;height:40px;align-items:center;gap:9px;padding:0 9px;border:0;border-top:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}.settings:hover{color:var(--text);background:var(--surface-hover)}.main{min-width:0;background:var(--surface-raised)}.topbar{display:flex;height:58px;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--border);background:rgba(251,252,251,.96)}.topbar-title{display:flex;align-items:center;gap:10px}.topbar-title .icon{color:var(--primary)}.topbar-title strong{display:block;font-size:15px}.topbar-title span{display:block;margin-top:2px;color:var(--muted);font-size:11px}.connection{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#36a486;box-shadow:0 0 0 3px #dcf3eb}.content{max-width:1120px;height:calc(100vh - 58px);margin:0 auto;padding:34px 42px;overflow:auto}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.page-heading h1{margin:0;font-size:23px;letter-spacing:-.02em}.page-heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.heading-actions{display:flex;gap:8px}.btn{display:inline-flex;height:34px;align-items:center;gap:7px;padding:0 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12px;white-space:nowrap}.btn:hover{border-color:#a6ccc2;background:var(--surface-hover)}.btn.primary{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:650}.btn.primary:hover{background:var(--primary-hover)}.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:18px}.search{flex:1;height:34px;padding:0 11px;border:1px solid var(--border);border-radius:6px;outline:none;background:var(--surface);color:var(--text);font-size:12px}.search:focus{border-color:var(--primary);box-shadow:0 0 0 2px #e2f2ee}.section{margin-top:23px}.section:first-child{margin-top:0}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border)}.section-head h2{margin:0;font-size:15px}.section-head span{color:var(--muted);font-size:11px}.resource-list{display:grid;gap:8px}.resource{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:68px;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);box-shadow:0 2px 5px rgba(35,54,48,.03)}.resource:hover,.resource.selected{border-color:#a6ccc2;box-shadow:0 0 0 2px #e5f3ef}.resource.selected{background:#fcfffe}.resource-icon{display:grid;width:38px;height:38px;place-items:center;border-radius:10px;background:#e6f3ef;color:var(--primary);font-size:17px}.resource-icon.blue{background:#e9f1f8;color:var(--blue)}.resource-icon.amber{background:#fbf2df;color:#a16f1c}.resource-copy strong{display:block;font-size:13px}.resource-copy small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.resource-meta{display:flex;align-items:center;gap:8px}.meta-line{color:var(--muted);font-size:10px;white-space:nowrap}.status{display:inline-flex;align-items:center;gap:5px;color:#3e8f77;font-size:11px;white-space:nowrap}.status.warn{color:var(--warning)}.status .dot{width:6px;height:6px;box-shadow:none}.status.warn .dot{background:#c99539}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{padding:3px 7px;border-radius:999px;background:#eef5f2;color:var(--primary-hover);font-size:10px}.chip.blue{background:#edf3f9;color:#3f6f98}.chip.amber{background:#fbf2df;color:#936719}.switch{position:relative;width:34px;height:20px;border:0;border-radius:999px;background:#bbc8c3;cursor:pointer}.switch.on{background:var(--primary)}.switch:after{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;content:"";transition:.16s ease}.switch.on:after{left:17px}.detail{margin-top:12px;padding:16px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.detail-head h3{margin:0;font-size:14px}.detail-head span{color:var(--muted);font-size:11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:10px}.field input{width:100%;height:31px;padding:0 9px;border:1px solid var(--border);border-radius:5px;outline:none;background:#fbfdfc;color:var(--text);font-size:11px}.detail-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:11px;border-top:1px solid var(--border)}.hint{max-width:70%;color:var(--muted);font-size:10px;line-height:1.5}.danger-link{border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:11px}.marketplace{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}.marketplace .btn{height:30px;font-size:11px}.marketplace strong{font-size:13px}.marketplace small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.modal-backdrop{position:fixed;inset:0;display:none;place-items:center;background:rgba(19,30,26,.26)}.modal-backdrop.show{display:grid}.modal{width:470px;padding:22px;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 18px 50px rgba(26,51,43,.16)}.modal h3{margin:0;font-size:17px}.modal p{margin:6px 0 17px;color:var(--muted);font-size:11px;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}@media(max-width:1100px){.content{padding:28px}}
  </style>
</head>
<body>
  <div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">B</span><strong>BeanAgent</strong></div><div class="quick-actions"><button data-toast="已准备新建对话">＋ <span>新对话</span></button><button data-toast="打开工作目录选择">▣ <span>添加工作目录</span></button></div><nav class="side-nav"><button>✦ <span>扩展</span><span class="badge">3</span></button><div class="side-subnav"><button class="active" data-tab="plugins">▣ <span>插件</span><span class="count">2</span></button><button data-tab="mcp">⚡ <span>MCP</span><span class="count">3</span></button><button data-tab="skills">✧ <span>技能 Skills</span><span class="count">6</span></button></div></nav><div class="session-list"><div class="section-title">置顶</div><div class="session active">分析 BeanAgent 工具调度</div><div class="section-title">项目</div><div class="workspace"><div class="workspace-head"><span class="folder">□</span><strong>Agent_change</strong><small>3</small></div><div class="session">设计可观测性方案</div><div class="session">评估项目发布流程</div></div><div class="section-title">最近</div><div class="session">你好</div><div class="session">今天的工作计划</div></div><button class="settings" data-toast="打开模型与连接设置">⚙ <span>设置</span></button></aside><main class="main"><header class="topbar"><div class="topbar-title"><span class="icon">✦</span><div><strong>扩展</strong><span>插件、MCP 与技能管理</span></div></div><div class="connection"><span class="dot"></span>服务已连接</div></header><div class="content" id="content"></div></main></div>
  <div class="modal-backdrop" id="modal"><div class="modal"><h3>添加 MCP 服务</h3><p>配置外部工具服务。保存前会先测试连接，敏感环境变量只展示键名。</p><div class="detail-grid"><div class="field"><label>名称</label><input placeholder="例如 filesystem" /></div><div class="field"><label>作用域</label><input value="用户级" /></div><div class="field full"><label>启动命令 / 服务地址</label><input placeholder="npx @modelcontextprotocol/server-filesystem" /></div><div class="field full"><label>环境变量 / 请求头</label><input placeholder="仅显示键名，值会被脱敏" /></div></div><div class="modal-actions"><button class="btn" id="closeModal">取消</button><button class="btn primary" id="saveModal">测试并保存</button></div></div></div>
  <script>
    const content=document.getElementById('content'),modal=document.getElementById('modal'),toast=document.createElement('div');document.body.appendChild(toast);let timer;
    function showToast(text){toast.textContent=text;toast.style.cssText='position:fixed;right:28px;bottom:24px;padding:10px 14px;border:1px solid #acd4c7;border-radius:7px;background:#f2fbf7;color:#095f59;box-shadow:0 18px 50px rgba(26,51,43,.10);font-size:12px;z-index:20';clearTimeout(timer);timer=setTimeout(()=>toast.remove(),1800)}
    const heading=(title,copy,actions)=>`<div class="page-heading"><div><h1>${title}</h1><p>${copy}</p></div><div class="heading-actions">${actions}</div></div>`;
    function bind(){document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>showToast(b.dataset.toast));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>b.classList.toggle('on'))}
    function renderPlugins(){content.innerHTML=heading('插件','安装和管理可扩展能力包；插件可以提供 Skills、MCP、Commands 和 Hooks。','<button class="btn" data-toast="预览：打开 Marketplace 来源管理">⚙ Marketplace</button><button class="btn primary" data-toast="预览：打开插件导入">＋ 添加插件</button>')+'<div class="toolbar"><input class="search" placeholder="搜索已安装插件和 Marketplace"/><span class="meta-line">用户级 · 2 个已安装</span></div><section class="section"><div class="section-head"><h2>已安装</h2><span>可启用、配置、更新或卸载</span></div><div class="resource-list"><div class="resource"><div class="resource-icon">◈</div><div class="resource-copy"><strong>browser-use</strong><small>浏览器自动化与网页操作能力 · v0.5.1</small><div class="chips"><span class="chip">Skills 2</span><span class="chip blue">MCP 1</span><span class="chip amber">Commands 3</span></div></div><div class="resource-meta"><span class="status"><i class="dot"></i>已启用</span><button class="switch on" data-toggle></button></div></div><div class="resource"><div class="resource-icon blue">▤</div><div class="resource-copy"><strong>documents</strong><small>文档、PDF 和表格处理能力 · v1.2.0</small><div class="chips"><span class="chip">Skills 4</span><span class="chip amber">Commands 2</span></div></div><div class="resource-meta"><span class="status"><i class="dot"></i>已启用</span><button class="switch on" data-toggle></button></div></div></div></section><section class="section"><div class="section-head"><h2>Marketplace</h2><span>官方源 · 最近刷新 2 分钟前</span></div><div class="marketplace"><div class="resource-icon amber">✦</div><div><strong>GitHub PR Reviewer</strong><small>自动分析 Pull Request 并生成审查建议 · 提供 Skills 1、MCP 1</small></div><button class="btn primary" data-toast="预览：安装插件并检查权限">安装</button></div></section>';bind()}
    function renderMcp(){content.innerHTML=heading('MCP','连接外部工具服务，让 BeanAgent 获得更多可调用工具。','<button class="btn" data-toast="预览：导入 MCP JSON 配置">⇩ 导入 JSON</button><button class="btn primary" id="addMcp">＋ 添加 MCP</button>')+'<div class="toolbar"><input class="search" placeholder="搜索 MCP 服务"/><span class="status"><i class="dot"></i>2 已连接 · 1 待测试</span></div><div class="resource-list"><div class="resource selected"><div class="resource-icon">▤</div><div class="resource-copy"><strong>filesystem</strong><small>本地文件与目录工具 · stdio · 4 个工具</small></div><div class="resource-meta"><span class="status"><i class="dot"></i>已连接</span></div></div><div class="resource"><div class="resource-icon blue">◉</div><div class="resource-copy"><strong>github</strong><small>代码仓库与 Pull Request · HTTP · 8 个工具</small></div><div class="resource-meta"><span class="status"><i class="dot"></i>已连接</span></div></div><div class="resource"><div class="resource-icon amber">⌕</div><div class="resource-copy"><strong>browser-search</strong><small>浏览器搜索服务 · SSE · 等待测试</small></div><div class="resource-meta"><span class="status warn"><i class="dot"></i>未连接</span></div></div></div><div class="detail"><div class="detail-head"><div><h3>filesystem</h3><span>用户级 · 本地 stdio MCP</span></div><span class="status"><i class="dot"></i>已连接</span></div><div class="detail-grid"><div class="field full"><label>启动命令</label><input value="npx @modelcontextprotocol/server-filesystem ./" readonly/></div><div class="field"><label>工作目录</label><input value="D:\\code\\Agent_change" readonly/></div><div class="field"><label>环境变量</label><input value="已配置 2 项（已脱敏）" readonly/></div></div><div class="chips" style="margin-top:12px"><span class="chip">read_file</span><span class="chip">write_file</span><span class="chip">list_directory</span><span class="chip">search_files</span></div><div class="detail-foot"><span class="hint">启动外部进程前会显示来源和风险提示；连接失败会保留诊断信息。</span><button class="danger-link" data-toast="预览：移除 MCP 服务">移除服务</button></div></div>';document.getElementById('addMcp').onclick=()=>modal.classList.add('show');bind()}
    function renderSkills(){content.innerHTML=heading('技能 Skills','管理可复用的提示词与工作流能力包；来源和依赖状态清晰可见。','<button class="btn" data-toast="预览：导入 SKILL.md">⇩ 导入技能</button><button class="btn primary" data-toast="预览：创建新的 SKILL.md">＋ 新建技能</button>')+'<div class="toolbar"><input class="search" placeholder="搜索技能名称或描述"/><span class="meta-line">6 个可用 · 1 个依赖缺失</span></div><section class="section"><div class="section-head"><h2>已安装技能</h2><span>本地与用户级</span></div><div class="resource-list"><div class="resource"><div class="resource-icon">✧</div><div class="resource-copy"><strong>daily-report-writer</strong><small>根据工作记录生成中文工作日报 · 来源：内置</small></div><div class="resource-meta"><span class="status"><i class="dot"></i>可用</span><button class="switch on" data-toggle></button></div></div><div class="resource"><div class="resource-icon">✧</div><div class="resource-copy"><strong>project-analysis</strong><small>分析项目结构、风险和下一步计划 · 来源：工作区</small></div><div class="resource-meta"><span class="status"><i class="dot"></i>可用</span><button class="switch on" data-toggle></button></div></div><div class="resource"><div class="resource-icon amber">!</div><div class="resource-copy"><strong>browser-research</strong><small>网页检索与证据整理 · 缺少依赖：CLI browser</small></div><div class="resource-meta"><span class="status warn"><i class="dot"></i>需处理</span><button class="switch" data-toggle></button></div></div></div></section><section class="section"><div class="section-head"><h2>由插件提供</h2><span>插件卸载后同步移除</span></div><div class="resource-list"><div class="resource"><div class="resource-icon blue">◈</div><div class="resource-copy"><strong>control-browser</strong><small>browser-use · 控制浏览器标签页、点击和截图</small><div class="chips"><span class="chip blue">插件：browser-use</span><span class="chip">版本 0.5.1</span></div></div><div class="resource-meta"><span class="status"><i class="dot"></i>插件启用</span></div></div></div></section>';bind()}
    function selectTab(name){document.querySelectorAll('.side-subnav button').forEach(i=>i.classList.toggle('active',i.dataset.tab===name));if(name==='plugins')renderPlugins();else if(name==='mcp')renderMcp();else renderSkills()}
    document.querySelectorAll('.side-subnav button').forEach(t=>t.onclick=()=>selectTab(t.dataset.tab));document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>showToast(b.dataset.toast));document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');document.getElementById('saveModal').onclick=()=>{modal.classList.remove('show');showToast('预览：已测试连接并保存')};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};renderPlugins();
  </script>
</body>
</html>
